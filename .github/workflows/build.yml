name: Build Standoff 2 Cheat APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Standoff2Cheat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: standoff2-cheat-apk
          path: Standoff2Cheat/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
